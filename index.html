<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ส่งคำถาม – GS1 Thailand Annual Meeting 2026</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#002C6C;--orange:#F26334;--ink:#1b2333;--muted:#5b6475;--line:#d6dce7;--soft:#eef1f6;--err:#b3261e}
*{box-sizing:border-box;min-width:0}
body{margin:0;font:16px/1.6 'IBM Plex Sans Thai',system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--soft);-webkit-text-size-adjust:100%}
header{background:var(--navy);color:#fff;padding:26px 20px 70px;position:relative;overflow:hidden}
header::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:28px solid rgba(242,99,52,.85)}
.wrap{max-width:560px;margin:0 auto;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.02em;opacity:.9}
.brand i{width:9px;height:9px;border-radius:50%;background:var(--orange);display:inline-block}
h1{font-size:clamp(24px,6vw,30px);line-height:1.2;margin:14px 0 6px;text-wrap:balance}
header p{margin:0;opacity:.85}
main{padding:0 16px 32px}
.card{background:#fff;border-radius:18px;box-shadow:0 10px 30px rgba(0,44,108,.14);padding:22px;margin-top:-48px}
label,.lbl{display:block;font-weight:600;margin:20px 0 8px}
.first{margin-top:0}
.opt{font-weight:400;color:var(--muted);font-size:14px}
textarea,input{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);-webkit-appearance:none}
textarea{min-height:150px;resize:vertical;line-height:1.55}
textarea:focus,input:focus{border-color:var(--navy);outline:none;box-shadow:0 0 0 3px rgba(0,44,108,.16)}
.count{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}
button:focus-visible{outline:3px solid rgba(242,99,52,.55);outline-offset:2px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.row2 label{margin-top:0}
@media(max-width:480px){.row2{grid-template-columns:minmax(0,1fr)}}
.primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:20px;min-height:54px;border:0;border-radius:14px;background:var(--orange);color:#fff;font:inherit;font-size:18px;font-weight:600;cursor:pointer;transition:transform .12s}
.primary:active{transform:scale(.98)}
.primary[disabled]{opacity:.6;cursor:wait}
.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.msg{color:var(--err);font-size:14px;margin-top:12px;min-height:1px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.done{text-align:center;padding:10px 4px 4px}
.done h2{font-size:24px;margin:14px 0 6px;color:var(--navy)}
.done p{margin:0 0 6px;color:var(--muted)}
.ticket{display:inline-block;margin:10px 0 4px;padding:6px 16px;border-radius:999px;background:var(--soft);color:var(--navy);font-weight:700;font-size:18px}
.tick{width:76px;height:76px;margin:0 auto;border-radius:50%;background:#e7f5ec;display:grid;place-items:center;animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.tick{animation:none}.primary{transition:none}}
footer{text-align:center;font-size:13px;color:var(--muted);padding:0 16px 28px}
[hidden]{display:none!important}
</style>
<script>
window.API_URL = "https://script.google.com/macros/s/AKfycbyxSR-L_L0JbU11pKINL_boSwREgmqtHj0bRd-KpVn6N6hbUJrw-ekqsEB6I9jEfeL4/exec";
window.CFG = {"eventName":"GS1 Thailand Annual Meeting 2026","subtitle":"ส่งคำถามถึงวิทยากร","maxLen":500};
</script>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand"><i></i><span>GS1 Thailand</span></div>
    <h1 id="ev"></h1>
    <p id="sub"></p>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="card">
      <form id="f" novalidate>
        <label for="q" id="qLbl" class="first">คำถามของคุณ</label>
        <textarea id="q" maxlength="500" placeholder="พิมพ์คำถามที่ต้องการถามวิทยากร…" required></textarea>
        <div class="count"><span>ถามสั้น กระชับ ได้ใจความ</span><span id="cnt">0/500</span></div>

        <div class="row2" style="margin-top:20px">
          <div>
            <label for="nm">ชื่อ <span class="opt">(ไม่บังคับ)</span></label>
            <input id="nm" autocomplete="name" maxlength="80" placeholder="ไม่ระบุ = ไม่เปิดเผยชื่อ">
          </div>
          <div>
            <label for="org">บริษัท / หน่วยงาน <span class="opt">(ไม่บังคับ)</span></label>
            <input id="org" autocomplete="organization" maxlength="120">
          </div>
        </div>
        <input class="hp" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">

        <button class="primary" id="btn" type="submit">ส่งคำถาม</button>
        <div class="msg" id="msg" role="alert"></div>
      </form>

      <div class="done" id="done" hidden>
        <div class="tick"><svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="#1f8a4c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>
        <h2>ส่งคำถามเรียบร้อย</h2>
        <div class="ticket" id="ticket"></div>
        <p>ขอบคุณครับ/ค่ะ ทีมงานได้รับคำถามของคุณแล้ว</p>
        <button class="primary ghost" id="again" type="button">ส่งคำถามเพิ่ม</button>
      </div>
    </div>
  </div>
</main>
<footer>© GS1 Thailand · Q&A</footer>

<script>
{
  const CFG = window.CFG || { eventName: 'Q&A', subtitle: '', maxLen: 500 };
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  $('ev').textContent = CFG.eventName;
  $('sub').textContent = CFG.subtitle;
  $('q').maxLength = CFG.maxLen;

  // จำชื่อ/หน่วยงานไว้ในเครื่องนี้
  $('nm').value = store.get('qa_name');
  $('org').value = store.get('qa_org');

  // รหัสเครื่องแบบสุ่ม (ใช้กันส่งรัว ไม่ใช่ข้อมูลส่วนบุคคล)
  let cid = store.get('qa_cid');
  if (!cid) { cid = 'c' + Math.random().toString(36).slice(2) + Date.now().toString(36); store.set('qa_cid', cid); }

  const q = $('q');
  const updateCount = () => { $('cnt').textContent = q.value.length + '/' + CFG.maxLen; };
  q.addEventListener('input', () => { updateCount(); $('msg').textContent = ''; });
  updateCount();

  function api(payload) {
    return fetch(window.API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
      redirect: 'follow'
    }).then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }
  function send(payload, retry) {
    return api(payload).catch((err) => {
      if (!retry) throw err;
      return new Promise((r) => setTimeout(r, 1500)).then(() => send(payload, false));
    });
  }

  // ดึงชื่องาน/หัวข้อล่าสุดจากหลังบ้าน (ถ้าไม่สำเร็จใช้ค่าที่ฝังไว้ในหน้า)
  api({ action: 'config' }).then((c) => {
    if (!c || !c.ok) return;
    if (c.eventName) { CFG.eventName = c.eventName; $('ev').textContent = c.eventName; document.title = 'ส่งคำถาม – ' + c.eventName; }
    if (c.subtitle) { CFG.subtitle = c.subtitle; $('sub').textContent = c.subtitle; }
    if (c.maxLen) { CFG.maxLen = c.maxLen; q.maxLength = c.maxLen; updateCount(); }
  }).catch(() => {});

  $('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = q.value.trim();
    if (text.length < 3) { $('msg').textContent = 'กรุณาพิมพ์คำถามก่อนส่ง'; q.focus(); return; }
    const btn = $('btn');
    btn.disabled = true; btn.textContent = 'กำลังส่ง…';
    store.set('qa_name', $('nm').value.trim());
    store.set('qa_org', $('org').value.trim());
    try {
      const res = await send({
        question: text,
        name: $('nm').value.trim(), organization: $('org').value.trim(),
        clientId: cid, website: $('website').value
      }, true);
      if (!res || !res.ok) throw new Error((res && res.error) || 'ส่งไม่สำเร็จ');
      $('ticket').textContent = res.id ? 'คำถามหมายเลข ' + res.id : 'ได้รับแล้ว';
      q.value = ''; updateCount();
      $('f').hidden = true; $('done').hidden = false;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (err) {
      $('msg').textContent = (err && err.message && !/^HTTP|fetch|network/i.test(err.message)) ? err.message : 'ส่งไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่อีกครั้ง';
    } finally {
      btn.disabled = false; btn.textContent = 'ส่งคำถาม';
    }
  });

  $('again').addEventListener('click', () => {
    $('done').hidden = true; $('f').hidden = false; q.focus();
  });
}
</script>
</body>
</html>
